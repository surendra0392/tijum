appId: com.tijum.app
name: "02 - Customer Auth, Booking Hold, Reservation Cancel & Support Submission"
tags:
  - e2e
  - customer
  - booking
  - support
  - mutating
# Required runtime env vars (see apps/mobile/.maestro/env.example — NEVER hardcode passwords):
#   MAESTRO_API_URL
#   MAESTRO_CUSTOMER_EMAIL
#   MAESTRO_CUSTOMER_PASSWORD
#   MAESTRO_PROPERTY_ID
#   MAESTRO_BOOKING_CHECK_IN_DATE
#   MAESTRO_UPCOMING_BOOKING_REF
#   MAESTRO_CASE_MARKER
---
- runScript: scripts/require-qa-api.js
- launchApp:
    clearState: true

# Dismiss onboarding if shown
- runFlow:
    when:
      visible:
        id: "onboarding-skip-btn"
    commands:
      - tapOn:
          id: "onboarding-skip-btn"

- runFlow:
    when:
      visible:
        id: "onboarding-skip-permission-btn"
    commands:
      - tapOn:
          id: "onboarding-skip-permission-btn"

# 1. Customer Authentication (credentials supplied via runtime test env)
- openLink: "tijum:///(auth)/customer-login"
- assertVisible: "Welcome Back"
- assertVisible:
    id: "login-identifier-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-submit-button"

# Verify link to Customer Registration
- tapOn:
    id: "customer-register-link"
- assertVisible:
    id: "register-name-input"
- scrollUntilVisible:
    element:
      id: "register-submit-button"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
    timeout: 10000
- tapOn: "Sign In"

# Sign in using isolated fixture credentials from environment
- tapOn:
    id: "login-identifier-input"
- inputText: "${MAESTRO_CUSTOMER_EMAIL}"
- tapOn:
    id: "login-password-input"
- inputText: "${MAESTRO_CUSTOMER_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

# Confirm authenticated session reached Explore
- extendedWaitUntil:
    visible:
      id: "explore-search-input"
    timeout: 15000

# 2. Select Verified Property & Create Real Booking Hold
- scrollUntilVisible:
    element:
      id: "property-card-${MAESTRO_PROPERTY_ID}"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "property-card-${MAESTRO_PROPERTY_ID}"

- extendedWaitUntil:
    visible:
      id: "property-book-stay-btn"
    timeout: 10000
- tapOn:
    id: "property-book-stay-btn"

- assertVisible: "Confirm Booking"
- scrollUntilVisible:
    element:
      id: "booking-check-in-date-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "booking-check-in-date-input"
- eraseText: 10
- inputText: "${MAESTRO_BOOKING_CHECK_IN_DATE}"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Estimated Summary"
    direction: DOWN
    timeout: 12000

- scrollUntilVisible:
    element:
      id: "booking-submit-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "booking-submit-button"

# Open the held reservation from its creation confirmation.
- extendedWaitUntil:
    visible: "Proceed to Payment"
    timeout: 15000
- tapOn: "Proceed to Payment"

# 3. Capture the new reference and cancel that exact hold through the app.
- extendedWaitUntil:
    visible:
      id: "booking-pay-btn"
    timeout: 15000
- assertVisible: "Action Required: Pay to Confirm"
- copyTextFrom:
    id: "booking-reference"
- evalScript: ${output.reservationReference = maestro.copiedText}
- runScript:
    file: scripts/assert-booking-cancelled.js
    env:
      EXPECTED_BOOKING_STATUS: "awaiting_payment"
- scrollUntilVisible:
    element:
      id: "booking-cancel-btn"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "booking-cancel-btn"
- tapOn:
    text: "Cancel Reservation"
    below:
      text: "Are you sure you want to cancel this reservation[?] Cancellation policies will apply[.]"

- extendedWaitUntil:
    visible: "Reservation Cancelled"
    timeout: 12000
- tapOn: "OK"
- runScript:
    file: scripts/assert-booking-cancelled.js
    env:
      EXPECTED_BOOKING_STATUS: "cancelled"

# 4. Customer Protection Case Submission (Real Mutation — NOT closing the modal)
- openLink: "tijum:///customer/support"
- scrollUntilVisible:
    element:
      id: "support-raise-request-btn"
    direction: DOWN
    timeout: 12000

- tapOn:
    id: "support-raise-request-btn"
- assertVisible:
    id: "support-booking-ref-input"
- tapOn:
    id: "support-booking-ref-input"
- inputText: "${MAESTRO_UPCOMING_BOOKING_REF}"
- tapOn:
    id: "support-description-input"
- inputText: "Automated Maestro E2E support verification [${MAESTRO_CASE_MARKER}] requesting meal timing confirmation."
- hideKeyboard

# Actually submit the support protection request
- scrollUntilVisible:
    element:
      id: "support-submit-btn"
    direction: DOWN
    timeout: 6000
- tapOn:
    id: "support-submit-btn"

- extendedWaitUntil:
    visible: "Request Submitted"
    timeout: 12000
- tapOn: "OK"

# Assert backend database actually persisted the submitted customer protection case
- runScript: scripts/assert-case-created.js
