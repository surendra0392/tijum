appId: com.tijum.app
name: "02 - Customer Auth, Booking Hold, Razorpay Cancel, Reservation Cancel & Support Submission"
tags:
  - e2e
  - customer
  - booking
  - support
  - mutating
# Required runtime env vars (see apps/mobile/.maestro/env.example — NEVER hardcode passwords):
#   MAESTRO_API_URL
#   MAESTRO_CUSTOMER_EMAIL
#   MAESTRO_CUSTOMER_PASSWORD
#   MAESTRO_UPCOMING_BOOKING_REF
#   MAESTRO_CASE_MARKER
---
- launchApp:
    clearState: true

# Dismiss onboarding if shown
- runFlow:
    when:
      visible:
        id: "onboarding-skip-btn"
    commands:
      - tapOn:
          id: "onboarding-skip-btn"

- runFlow:
    when:
      visible:
        id: "onboarding-skip-permission-btn"
    commands:
      - tapOn:
          id: "onboarding-skip-permission-btn"

# 1. Customer Authentication (credentials supplied via runtime test env)
- openLink: "tijum://(auth)/customer-login"
- assertVisible: "Welcome Back"
- assertVisible:
    id: "login-identifier-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-submit-button"

# Verify link to Customer Registration
- tapOn:
    id: "customer-register-link"
- assertVisible:
    id: "register-submit-button"
- assertVisible:
    id: "register-name-input"
- back

# Sign in using isolated fixture credentials from environment
- tapOn:
    id: "login-identifier-input"
- inputText: "${MAESTRO_CUSTOMER_EMAIL}"
- tapOn:
    id: "login-password-input"
- inputText: "${MAESTRO_CUSTOMER_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

# Confirm authenticated session reached Explore
- extendedWaitUntil:
    visible:
      id: "explore-search-input"
    timeout: 15000

# 2. Select Verified Property & Create Real Booking Hold
- scrollUntilVisible:
    element:
      id: "property-card-.*"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "property-card-.*"

- extendedWaitUntil:
    visible:
      id: "property-book-stay-btn"
    timeout: 10000
- tapOn:
    id: "property-book-stay-btn"

- extendedWaitUntil:
    visible: "Estimated Summary"
    timeout: 12000
- assertVisible: "Confirm Booking"
- assertVisible: "Total Payable"

- scrollUntilVisible:
    element:
      id: "booking-submit-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "booking-submit-button"

# Handle intermediate confirmation modal if displayed
- runFlow:
    when:
      visible: "Proceed to Payment"
    commands:
      - tapOn: "Proceed to Payment"

# 3. Verify Hold State, Test-Mode Razorpay Entry & Safe Dismissal, then Cancel Hold
- extendedWaitUntil:
    visible:
      id: "booking-pay-btn"
    timeout: 15000
- assertVisible: "Action Required: Pay to Confirm"
- assertVisible:
    id: "booking-cancel-btn"

# Trigger Razorpay checkout (in test mode) and safely cancel/dismiss without mutating live funds
- tapOn:
    id: "booking-pay-btn"
- runFlow:
    when:
      visible: "Payment Incomplete"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      notVisible:
        id: "booking-cancel-btn"
    commands:
      - back
      - runFlow:
          when:
            visible: "Yes"
          commands:
            - tapOn: "Yes"

# Reservation MUST remain awaiting_payment after checkout dismissal — now execute real cancellation
- extendedWaitUntil:
    visible:
      id: "booking-cancel-btn"
    timeout: 10000
- tapOn:
    id: "booking-cancel-btn"
- assertVisible: "Are you sure you want to cancel this reservation? Cancellation policies will apply."
- tapOn: "Cancel Reservation"

- extendedWaitUntil:
    visible: "Reservation Cancelled"
    timeout: 12000
- tapOn: "OK"
- assertVisible: "Cancellation & Refund Tracking"

# Assert backend database actually transitioned this reservation to status=cancelled
- runScript: scripts/assert-booking-cancelled.js

# 4. Customer Protection Case Submission (Real Mutation — NOT closing the modal)
- openLink: "tijum://(customer)/support"
- extendedWaitUntil:
    visible:
      id: "support-raise-request-btn"
    timeout: 12000
- assertVisible: "Official Support Helpline"
- assertVisible: "Customer Protection SLAs"

- tapOn:
    id: "support-raise-request-btn"
- assertVisible:
    id: "support-booking-ref-input"
- tapOn:
    id: "support-booking-ref-input"
- inputText: "${MAESTRO_UPCOMING_BOOKING_REF}"
- tapOn:
    id: "support-description-input"
- inputText: "Automated Maestro E2E support verification [${MAESTRO_CASE_MARKER}] requesting meal timing confirmation."
- hideKeyboard

# Actually submit the support protection request
- scrollUntilVisible:
    element:
      id: "support-submit-btn"
    direction: DOWN
    timeout: 6000
- tapOn:
    id: "support-submit-btn"

- extendedWaitUntil:
    visible: "Request Submitted"
    timeout: 12000
- tapOn: "OK"

# Assert backend database actually persisted the submitted customer protection case
- runScript: scripts/assert-case-created.js
