appId: com.tijum.app
name: "03 - Partner Auth, Property Creation, Room Inventory, Front-Desk Check-In/Out & KYC Update"
tags:
  - e2e
  - partner
  - operations
  - kyc
  - mutating
# Required runtime env vars (see apps/mobile/.maestro/env.example — NEVER hardcode passwords):
#   MAESTRO_API_URL
#   MAESTRO_PARTNER_EMAIL
#   MAESTRO_PARTNER_PASSWORD
#   MAESTRO_PROPERTY_ID
#   MAESTRO_TODAY_BOOKING_REF
#   MAESTRO_NEW_PROPERTY_NAME
#   MAESTRO_NEW_ROOM_NUMBER
#   MAESTRO_KYC_PAN
#   MAESTRO_KYC_IFSC
#   MAESTRO_KYC_ACCOUNT
---
- runScript: scripts/require-qa-api.js
- launchApp:
    clearState: true

# Dismiss onboarding if shown
- runFlow:
    when:
      visible:
        id: "onboarding-skip-btn"
    commands:
      - tapOn:
          id: "onboarding-skip-btn"

- runFlow:
    when:
      visible:
        id: "onboarding-skip-permission-btn"
    commands:
      - tapOn:
          id: "onboarding-skip-permission-btn"

# 1. Partner Authentication (credentials supplied via runtime test env)
- openLink: "tijum:///(auth)/owner-login"
- assertVisible: "Welcome Back, Partner"
- assertVisible:
    id: "partner-login-identifier-input"
- assertVisible:
    id: "partner-login-password-input"
- assertVisible:
    id: "partner-login-submit-button"

# Verify Partner Registration / Onboarding Link uses canonical categories
- tapOn:
    id: "partner-register-link"
- assertVisible: "List Your Property"
- scrollUntilVisible:
    element:
      text: "Hostels/PG"
    direction: DOWN
    timeout: 10000
- assertVisible: "Hostels/PG"
- assertVisible: "Homestays"
- assertVisible: "Co-Living"
- scrollUntilVisible:
    element:
      text: "Partner Sign In"
    direction: DOWN
    timeout: 10000
- tapOn: "Partner Sign In"

# Sign in using isolated partner fixture credentials
- tapOn:
    id: "partner-login-identifier-input"
- inputText: "${MAESTRO_PARTNER_EMAIL}"
- tapOn:
    id: "partner-login-password-input"
- inputText: "${MAESTRO_PARTNER_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "partner-login-submit-button"

# Confirm Partner Dashboard loaded with real metrics
- extendedWaitUntil:
    visible: "Arrivals Today"
    timeout: 15000

# 2. Partner Property Draft Creation (Real 3-Step Mutation)
- openLink: "tijum:///partner/properties"
- extendedWaitUntil:
    visible:
      id: "partner-add-property-btn"
    timeout: 12000
- tapOn:
    id: "partner-add-property-btn"

# Step 1: Canonical category + basic overview + primary contact
- extendedWaitUntil:
    visible:
      id: "partner-prop-name-input"
    timeout: 12000
- tapOn:
    id: "partner-prop-name-input"
- inputText: "${MAESTRO_NEW_PROPERTY_NAME}"
- tapOn:
    id: "partner-prop-description-input"
- inputText: "Automated Maestro E2E draft property verifying canonical category and partner listing persistence."
- scrollUntilVisible:
    element:
      id: "partner-prop-contact-name-input"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "partner-prop-contact-name-input"
- inputText: "Kalyan Chakravarthy"
- tapOn:
    id: "partner-prop-contact-phone-input"
- inputText: "9848099888"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "partner-prop-next-btn"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "partner-prop-next-btn"

# Step 2: City & Address
- extendedWaitUntil:
    visible:
      id: "partner-prop-city-hyderabad"
    timeout: 10000
- tapOn:
    id: "partner-prop-city-hyderabad"
- tapOn:
    id: "partner-prop-locality-input"
- inputText: "Madhapur"
- tapOn:
    id: "partner-prop-address1-input"
- inputText: "Plot 99, QA Verification Road"
- scrollUntilVisible:
    element:
      id: "partner-prop-pincode-input"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "partner-prop-pincode-input"
- inputText: "500081"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "partner-prop-next-btn"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "partner-prop-next-btn"

# Step 3: Declaration & Submit
- scrollUntilVisible:
    element:
      id: "partner-prop-declaration-checkbox"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "partner-prop-declaration-checkbox"
- scrollUntilVisible:
    element:
      id: "partner-prop-submit-btn"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "partner-prop-submit-btn"

- extendedWaitUntil:
    visible: "Draft Created"
    timeout: 15000
- tapOn: "OK"

# Assert backend database actually persisted the new property draft
- runScript: scripts/assert-property-created.js

# 3. Partner Physical Room Inventory Mutation
- openLink: "tijum:///partner/properties/${MAESTRO_PROPERTY_ID}/rooms"
- extendedWaitUntil:
    visible:
      id: "partner-room-add-btn"
    timeout: 12000
- tapOn:
    id: "partner-room-add-btn"

- extendedWaitUntil:
    visible:
      id: "partner-room-number-input"
    timeout: 8000
- tapOn:
    id: "partner-room-number-input"
- inputText: "${MAESTRO_NEW_ROOM_NUMBER}"
- tapOn:
    id: "partner-room-floor-input"
- inputText: "4"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "partner-room-submit-btn"
    direction: DOWN
    timeout: 6000
- tapOn:
    id: "partner-room-submit-btn"

- extendedWaitUntil:
    visible: "Added"
    timeout: 12000
- tapOn: "OK"

# Assert backend database persisted the new physical room
- runScript: scripts/assert-room-added.js

# 4. Partner Front-Desk Check-In & Check-Out Lifecycle (Real Mutations)
- openLink: "tijum:///partner/reservations/${MAESTRO_TODAY_BOOKING_REF}"

- scrollUntilVisible:
    element:
      id: "partner-checkin-notes-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "partner-checkin-notes-input"
- inputText: "Maestro E2E verified guest ID and handed over keys"
- hideKeyboard
- tapOn:
    id: "partner-checkin-btn"
- assertVisible: "Confirm Guest Check-In"
- tapOn: "Confirm Check-In"

- extendedWaitUntil:
    visible: "Guest Checked In"
    timeout: 12000
- tapOn: "OK"

# Assert backend persisted checked_in_at timestamp
- runScript:
    file: scripts/assert-checkin-checkout.js
    env:
      ASSERT_CHECKOUT: "false"

# Now perform guest Check-Out
- scrollUntilVisible:
    element:
      id: "partner-checkout-notes-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "partner-checkout-notes-input"
- inputText: "Maestro E2E room inspected and keys collected"
- hideKeyboard
- tapOn:
    id: "partner-checkout-btn"
- assertVisible: "Confirm Guest Checkout"
- tapOn: "Confirm Checkout"

- extendedWaitUntil:
    visible: "Guest Checked Out"
    timeout: 12000
- tapOn: "OK"

# Assert backend persisted both checked_in_at and checked_out_at timestamps
- runScript:
    file: scripts/assert-checkin-checkout.js
    env:
      ASSERT_CHECKOUT: "true"

# 5. Partner Financial Profile & KYC Submission (Real Mutation)
- openLink: "tijum:///partner/financial-profile"
- extendedWaitUntil:
    visible:
      id: "partner-kyc-edit-btn"
    timeout: 12000
- assertVisible: "Financial Profile"
- tapOn:
    id: "partner-kyc-edit-btn"

- extendedWaitUntil:
    visible:
      id: "partner-kyc-pan-input"
    timeout: 8000
- tapOn:
    id: "partner-kyc-pan-input"
- eraseText: 15
- inputText: "${MAESTRO_KYC_PAN}"
- scrollUntilVisible:
    element:
      id: "partner-kyc-account-input"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "partner-kyc-account-input"
- inputText: "${MAESTRO_KYC_ACCOUNT}"
- scrollUntilVisible:
    element:
      id: "partner-kyc-ifsc-input"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "partner-kyc-ifsc-input"
- eraseText: 15
- inputText: "${MAESTRO_KYC_IFSC}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "partner-kyc-save-btn"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "partner-kyc-save-btn"

- extendedWaitUntil:
    visible: "Success"
    timeout: 12000
- tapOn: "OK"

# Assert backend database persisted the KYC financial profile update
- runScript: scripts/assert-kyc-updated.js
