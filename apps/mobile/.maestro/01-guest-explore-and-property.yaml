appId: com.tijum.app
name: "01 - Guest Onboarding, Explore, Category Filters & Property Details"
tags:
  - e2e
  - customer
  - guest
---
- launchApp:
    clearState: true

# 1. Onboarding Screen & Permission Dismissal
- assertVisible:
    id: "onboarding-skip-btn"
- tapOn:
    id: "onboarding-skip-btn"

# Optional location/notification permission skip if prompted
- runFlow:
    when:
      visible:
        id: "onboarding-skip-permission-btn"
    commands:
      - tapOn:
          id: "onboarding-skip-permission-btn"

# 2. Explore Screen & Category Discovery
- assertVisible:
    id: "explore-search-input"

- assertVisible:
    id: "category-tab-all"
- assertVisible:
    id: "category-tab-hostels-pg"
- assertVisible:
    id: "category-tab-homestays"
- assertVisible:
    id: "category-tab-co-living"

# Test Category Switching (Canonical categories only)
- tapOn:
    id: "category-tab-hostels-pg"
- tapOn:
    id: "category-tab-homestays"
- tapOn:
    id: "category-tab-co-living"
- tapOn:
    id: "category-tab-all"

# 3. Search and Filter Interaction
- tapOn:
    id: "explore-search-input"
- inputText: "Hyderabad"
- pressKey: enter

# Open and dismiss advanced filter sheet
- tapOn:
    id: "explore-filter-button"
- assertVisible: "Stay Filters"
- tapOn:
    id: "explore-filter-close-button"

# 4. Property Detail Inspection
- scrollUntilVisible:
    element:
      id: "property-card-${MAESTRO_PROPERTY_ID}"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "property-card-${MAESTRO_PROPERTY_ID}"

# Verify Property Screen Sections
- assertVisible:
    id: "property-book-stay-btn"
- scrollUntilVisible:
    element:
      text: "Available Room Categories"
    direction: DOWN
    timeout: 8000
- scrollUntilVisible:
    element:
      text: "About This Stay"
    direction: DOWN
    timeout: 8000

# Verify Stay Timing & Meal Disclosures
- scrollUntilVisible:
    element:
      text: "Amenities"
    direction: DOWN
    timeout: 8000

- tapOn: "Go back"
- assertVisible:
    id: "explore-search-input"
